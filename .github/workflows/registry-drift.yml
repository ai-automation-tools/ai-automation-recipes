name: Registry drift

# Daily: is the catalog the Cronsole gallery reads (ai-automation-recipes.ai-automation-tools.dev/
# registry/) the one on main? A deploy that failed or never ran leaves registry/ correct and the
# public copy stale, and nothing inside the repo can see that. A failure here means re-run the
# Homepage workflow on main.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hosted catalog matches registry/
        run: python scripts/check_registry_published.py
