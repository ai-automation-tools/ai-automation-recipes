name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the leak scan reads every commit, not just the tree

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Registry is up to date
        run: python scripts/build_registry.py --check

      - name: A released VERSION's bundle never changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          built=$(python scripts/build_bundle.py | awk '{print $NF}')
          if gh release download "v${version}" -p '*.sha256' -O released.sha256 2> /dev/null; then
            released=$(cut -d' ' -f1 released.sha256)
            if [ "$built" != "$released" ]; then
              echo "::error::v${version} is already released with a different runtime bundle. Bump VERSION, then run scripts/build_registry.py."
              exit 1
            fi
          fi

      - name: No keys, home paths or emails, in the tree or in any commit
        run: python scripts/check_public.py --history

      - name: Every recipe's prompt fills
        env:
          GH_TOKEN: ${{ github.token }}  # pr-review lists a public repo's open PRs before it fills
        run: |
          mkdir -p "$RUNNER_TEMP/apps/demo" && echo '<!doctype html>' > "$RUNNER_TEMP/apps/demo/index.html"
          for r in recipes/*/run.py; do
            extra=()
            case "$r" in
              */app-enhancement/*) extra=(--apps-dir "$RUNNER_TEMP/apps") ;;
              */pr-review/*) extra=(--repo octocat/Hello-World) ;;
            esac
            python "$r" --output-dir "$RUNNER_TEMP/out" --dry-run "${extra[@]}" > /dev/null
          done
